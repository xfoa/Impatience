[package]
name = "impatience"
version = "1.0.0"
edition = "2024"
authors = ["foax <a@fo.ax>"]
description = "A library for instrumentation of event-to-event latency over a network"
license = "GPL-3.0"
repository = "https://github.com/xfoa/Impatience"
keywords = ["time", "sync", "udp", "network", "clock"]
categories = ["network-programming", "date-and-time", "development-tools::profiling"]
rust-version = "1.95"

[lib]
name = "impatience"
path = "src/lib.rs"

[[bin]]
name = "impatience"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
paste = "1.0.15"
seq-macro = "0.3.6"

# std feature dependencies
rkyv = { version = "0.8", optional = true }

# cli feature dependencies
clap = { version = "4", features = ["derive"], optional = true }
crossterm = { version = "0.29", optional = true }
libc = { version = "0.2", optional = true }
rand = { version = "0.10.1", optional = true }
serde_json = { version = "1", optional = true }

# optional features
serde = { version = "1", features = ["derive"], optional = true }
statrs = { version = "0.18", optional = true }

[features]
default = ["std", "cli", "serde", "svg"]
std = ["alloc", "dep:rkyv"]
alloc = []
cli = ["std", "svg", "dep:clap", "dep:crossterm", "dep:libc", "dep:rand", "dep:serde_json"]
svg = ["std"]
serde = ["dep:serde"]
uncertainty = ["dep:statrs"]
